<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebe6df;--app:#f7f4ef;--card:#fff;--ink:#2b2724;--muted:#8a7f75;--line:#e7e0d6;--acc:#8a6a4b;--acc2:#efe5da;--soft:#f0ebe4;--ink2:#5a5048;--app2:#fbf7f1;--line2:#c9beb0;--gold:#AF9263;--hfont:"Noto Serif TC",serif;--nav:#fff;
--ok:#4f7a5c;--ok2:#e3eee5;--warn:#b9773a;--warn2:#f7e9d9;--bad:#b0483c;--bad2:#f6e1dd;--info:#5b6f8c;--info2:#e3e9f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;background:var(--app);min-height:100vh;position:relative;display:flex;flex-direction:column}
@media(min-width:600px){.app{margin:16px auto;min-height:calc(100vh - 32px);border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(60,40,20,.12)}}
.top{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;background:var(--app);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.brand{font-size:10px;letter-spacing:.22em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.brand a{letter-spacing:.05em;color:var(--acc);cursor:pointer;font-size:12px}
.top h1{font-family:var(--hfont);font-size:21px;margin:4px 0 0;font-weight:700}
.top h1.big{font-size:26px;letter-spacing:.06em}
.sub{margin-top:8px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sub b{color:var(--ink);font-weight:500}.sub b.bad{color:var(--bad)}
.back{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:5px 12px 5px 10px;font-size:13px;letter-spacing:.08em;cursor:pointer;border:0;font-family:inherit}
.pv{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.pv button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.pv button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pvbar{background:var(--warn2);color:var(--warn);font-size:12px;padding:7px 12px;border-radius:10px;margin-top:8px}
main{flex:1;padding:14px 14px 110px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav button{border:0;background:none;font:inherit;font-size:11px;color:var(--muted);padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button .ic{font-size:17px;line-height:1}
.nav button.on{color:var(--ink);font-weight:500}
.badge{position:absolute;top:2px;right:18%;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
h2{font-family:var(--hfont);font-size:16px;margin:18px 2px 10px;display:flex;align-items:baseline;gap:6px}
h2:first-child{margin-top:4px}
h2 small{font-family:"Noto Sans TC";font-weight:400;font-size:12px;color:var(--muted)}
h2 .act{margin-left:auto;font-family:"Noto Sans TC";font-weight:400;font-size:13px;color:var(--acc);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.tap{cursor:pointer;transition:transform .08s}.tap:active{transform:scale(.99)}
.row2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.t{font-weight:500;font-size:14.5px}
.s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}
.s .bad{color:var(--bad)}
.mini{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--ok2);color:var(--ok)}.c-warn{background:var(--warn2);color:var(--warn)}.c-bad{background:var(--bad2);color:var(--bad)}.c-info{background:var(--info2);color:var(--info)}.c-mute{background:var(--soft);color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .n{font-family:var(--hfont);font-size:26px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.warn .n{color:var(--warn)}.kpi.bad .n{color:var(--bad)}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.btn{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}.btn.sec{background:var(--acc2);color:var(--acc)}.btn.ok{background:var(--ok);color:#fff}.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border:0;border-radius:99px;padding:13px 18px;font:inherit;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;z-index:7}
.fab.home{bottom:calc(22px + env(safe-area-inset-bottom))}
.todo{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.todo:last-child{border-bottom:0}
.ck{flex:0 0 22px;height:22px;border-radius:50%;border:1.6px solid var(--line2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-top:1px}
.todo.done .ck{background:var(--ok);border-color:var(--ok)}
.todo.done .tt{color:var(--muted);text-decoration:line-through}
.ck.ins{border-radius:6px;border-color:var(--acc);color:var(--acc);font-size:11px}
.tt{font-size:14px;line-height:1.5}
.tl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.more{font-size:12.5px;color:var(--acc);text-align:center;padding:10px;cursor:pointer}
.info{display:grid;grid-template-columns:84px 1fr;gap:7px 10px;font-size:13.5px}
.info dt{color:var(--muted);font-size:12.5px}.info dd{margin:0}
.info a{color:var(--acc);text-decoration:none}
.month{font-size:12px;color:var(--muted);letter-spacing:.12em;margin:14px 2px 6px}
.lgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lrow{border-bottom:1px solid var(--line)}.lrow:last-child{border-bottom:0}
.lhead{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}
.lrow.open .lhead{background:var(--app2)}
.caret{color:var(--muted);font-size:11px;width:10px;transition:transform .15s}.lrow.open .caret{transform:rotate(90deg)}
.ld{font-size:14px;font-weight:500;white-space:nowrap}
.lgs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tchip{display:inline-block;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap}
.late{font-size:10.5px;color:var(--warn);background:var(--warn2);border-radius:6px;padding:1px 6px;white-space:nowrap}
.idot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:0 0 8px}
.icount{font-size:10px;background:var(--acc);color:#fff;border-radius:99px;padding:1px 6px}
.lby{font-size:12px;color:var(--muted);white-space:nowrap}
.lbody{padding:4px 12px 14px 30px;font-size:13.5px;line-height:1.7;display:none}
.lrow.open .lbody{display:block}
.stamp{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.issue{margin-top:8px;background:var(--bad2);color:var(--bad);border-radius:9px;padding:7px 10px;font-size:12.5px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pc{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,var(--line2),var(--line2));cursor:pointer}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instr{margin-top:10px;border-left:3px solid var(--acc);background:var(--app2);padding:8px 10px;border-radius:0 9px 9px 0;font-size:12.5px;line-height:1.6}
.instr .who{color:var(--muted);font-size:11.5px}
.reply{margin-top:6px;padding:6px 9px;background:var(--card);border-radius:8px;font-size:12.5px;white-space:pre-wrap}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:22px 0}
.soon{text-align:center;padding:50px 20px;color:var(--muted);font-size:13.5px;line-height:1.8}
.soon b{display:block;font-family:var(--hfont);font-size:17px;color:var(--ink);margin-bottom:6px}
.mask{position:fixed;inset:0;background:rgba(30,20,10,.35);z-index:20;display:none}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--app);border-radius:20px 20px 0 0;z-index:21;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:none}
.sheet .x{position:sticky;top:0;float:right;border:0;background:var(--soft);border-radius:99px;width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--ink2);z-index:2}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:6px auto 12px}
.sheet h3{font-family:var(--hfont);margin:0 0 4px;font-size:18px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:84px;resize:vertical}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
.tpick button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.tpick button.on{color:#fff}
.tpick button.other{border-style:dashed;color:var(--acc)}
.otherrow{display:none;gap:6px;margin-top:8px}.otherrow input{flex:1}
.addph{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line2);border-radius:12px;padding:16px;color:var(--acc);font-size:14px;cursor:pointer;background:var(--card)}
.phl{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.phi{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
.phi img,.phi .ph0{width:64px;height:48px;object-fit:cover;border-radius:6px;flex:0 0 64px;background:#ddd}
.phi input{padding:8px;font-size:14px}
.phi .rm{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw i{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent}.sw i.on{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:.95}
.loading{position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(247,244,239,.6);z-index:50;font-size:13px;color:var(--muted);display:none}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{padding:80px 20px;text-align:center;color:var(--muted)}
.boot .logo{font-family:var(--hfont);font-size:22px;color:var(--ink);letter-spacing:.2em;margin-bottom:8px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px 120px;text-align:center}
.login .logo{width:150px;height:auto;display:block}
.login h1{font-family:var(--hfont);font-size:21px;font-weight:600;margin:30px 0 0;letter-spacing:.14em;color:var(--ink)}
.login .rule{width:36px;height:1px;background:var(--gold);margin:18px auto 30px}
.login .gbtn{min-height:44px}
.login .hint{color:var(--muted);font-size:12.5px;line-height:1.7;margin:16px 0 0}
.login .lerr{color:var(--bad);font-size:13px;margin-top:10px;min-height:20px}
.login .foot{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;line-height:1}
.login .foot b{display:block;font-family:var(--hfont);font-weight:500;font-size:19px;letter-spacing:.55em;padding-left:.55em;color:var(--ink)}
.login .foot i{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:9px;font-style:normal;font-size:9.5px;letter-spacing:.42em;padding-left:.42em;color:var(--gold)}
.login .foot i:before,.login .foot i:after{content:"";width:22px;height:1px;background:var(--gold);opacity:.6}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:60;background:var(--ink);color:#fff;border-radius:99px;padding:10px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);cursor:pointer;display:none;white-space:nowrap}
.ptr{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translate(-50%,-60px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--muted);transition:transform .15s}
.newdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
.tip{background:var(--info2);color:var(--info);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:12px;position:relative}
.tip b{font-weight:500}.tip .tx{position:absolute;right:8px;top:6px;cursor:pointer}
.err{background:var(--bad2);color:var(--bad);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.6}
.lst{margin-top:10px;font-size:12px;border-radius:9px;padding:7px 10px;line-height:1.6}
.lst.mute{background:var(--soft);color:var(--ink2)}.lst.warn{background:var(--warn2);color:var(--warn)}.lst.bad{background:var(--bad2);color:var(--bad)}.lst.ok{background:var(--ok2);color:var(--ok)}
.diff{margin:10px 0 12px;border:1.5px dashed var(--warn);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.7;background:var(--app2)}
.diff .dh{font-size:12px;color:var(--warn);font-weight:500;margin-bottom:4px}
.diff .dk{font-size:11.5px;color:var(--muted);margin-top:6px}
.diff del{background:#f6dcd7;color:#9a3b30;text-decoration:line-through}.diff ins{background:#dcefe0;color:#2f6a40;text-decoration:none}
.diff .gone{display:inline-block;position:relative;width:64px;height:48px;border-radius:6px;overflow:hidden;margin:4px 4px 0 0;background:#ddd;outline:2px solid var(--bad)}
.diff .gone img{width:100%;height:100%;object-fit:cover;opacity:.6}.diff .gone b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:11px}
.warnbox{background:var(--warn2);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;margin-top:6px}
.ck.lg{border-radius:6px;border-color:var(--info);color:var(--info);font-size:11px}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
/* 驗收修正 2026-11-19：點擊範圍、滑動提示、長字換行、橫式版面、更新失敗提示 */
.pv button{min-height:40px;padding:9px 14px;font-size:13px}
.ov .ovlog{margin-top:10px;font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}.ov .ovst{font-size:11px;color:var(--warn)}
.ov .ovph{display:flex;gap:6px;margin-top:8px;align-items:center}.ov .ovph span{width:64px;height:48px;border-radius:7px;overflow:hidden;background:var(--soft);display:block}.ov .ovph img{width:100%;height:100%;object-fit:cover}.ov .ovph em{font-style:normal;font-size:12px;color:var(--muted)}
.ov .issue{margin-top:8px}
.ptabs{margin-bottom:12px}.ptabs button{font-size:12.5px;padding:9px 4px}
.chk{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.chkh{font-size:12px;color:var(--muted);margin-bottom:4px}
.chkr{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13px;cursor:pointer}.chkr.bad{color:var(--bad)}.chkr small{color:var(--warn);font-size:11px}
.cb{flex:0 0 20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px}.cb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
body.syncing::after{content:'更新中…';position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:70;background:rgba(43,38,34,.82);color:#fff;font-size:11px;padding:3px 9px;border-radius:10px;pointer-events:none}
.pdfst{font-size:12.5px;font-weight:600}.pdfst.ok{color:var(--ok)}.pdfst.run{color:var(--info,#3b6ea8)}.pdfst.warn{color:var(--warn)}.pdfst.bad{color:var(--bad)}
.pdfst.run::before{content:'';display:inline-block;width:10px;height:10px;margin-right:5px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flashbg{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flashbg 2.2s ease-out;border-radius:12px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;margin-top:10px}.sgrid div{background:var(--app2);border-radius:9px;padding:7px 8px;min-width:0}.sgrid span{display:block;font-size:11px;color:var(--muted)}.sgrid b{font-size:15px;font-weight:600}
.spad{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:12px;background:var(--card);touch-action:none;display:block}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.prow{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.phead{display:flex;gap:10px;align-items:flex-start;padding:12px 12px;cursor:pointer}
.pno{flex:0 0 22px;height:22px;border-radius:50%;background:var(--soft);color:var(--ink2);font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pmain{flex:1;min-width:0}.pt{font-size:14.5px;font-weight:500;overflow-wrap:anywhere}.ps{font-size:12px;color:var(--muted);margin-top:3px}
.pold{margin-left:6px;text-decoration:line-through;opacity:.75}.pchk{color:var(--warn)}
.phint{margin-top:6px;font-size:12px;background:var(--info2);color:var(--info);border-radius:8px;padding:5px 8px}
.pbody{display:none;padding:0 12px 12px 44px}.prow.open .pbody{display:block}
.phist{margin-top:10px;font-size:12px;color:var(--ink2);line-height:1.6}.phist>div{padding:6px 0;border-top:1px dashed var(--line)}.phist span{color:var(--muted)}
.fsec{margin:18px 0 -4px;font-size:12px;color:var(--gold);letter-spacing:.12em;font-weight:500;border-top:1px solid var(--line);padding-top:12px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.dgrid>div{min-width:0}.dgrid input{width:100%}
.pvwrap{position:relative}
.pvwrap.ovf:after{content:"";position:absolute;right:0;top:10px;height:42px;width:40px;background:linear-gradient(90deg,transparent,var(--app) 80%);pointer-events:none}
html[data-theme=graphite] .pvwrap.ovf:after{background:linear-gradient(90deg,transparent,var(--head) 80%)}
.pvwrap.end:after{display:none}
.pvhint{display:none;font-size:11px;color:var(--muted);margin-top:4px;text-align:right}
.pvwrap.ovf .pvhint{display:block}.pvwrap.end .pvhint{visibility:hidden}
h2 .act{padding:11px 6px 11px 14px;margin:-11px -6px -11px auto}
.brand a{display:inline-block;padding:9px 4px;margin:-9px 0}
.todo.ro{cursor:default}
.lnote{display:block;font-size:11px;opacity:.85}
.t,.tt,.s,.top h1,.info dd,.lbody,.instr,.reply,.issue,.lst,.mini span,.diff,.warnbox,.sheet .s{overflow-wrap:anywhere;word-break:break-word}
.row2>div,.lgs,.todo>div{min-width:0}
.info{grid-template-columns:84px minmax(0,1fr)}
.app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.neterr{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));width:calc(100% - 24px);max-width:536px;z-index:35;background:var(--bad2);color:var(--bad);border:1px solid #e9c2bb;border-radius:12px;padding:9px 10px 9px 12px;font-size:12.5px;line-height:1.5;display:none;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.neterr span{flex:1}.neterr small{opacity:.8}
.neterr button{border:0;background:var(--bad);color:#fff;border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:40px}
.neterr b{font-weight:400;padding:8px;cursor:pointer}
@media (orientation:landscape) and (max-height:520px){
  .top{position:static;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}
  .top h1.big{font-size:21px}.sub{margin-top:4px}
  .pv{margin-top:6px}.pvbar{margin-top:6px;padding:5px 10px}
  .tip{padding:6px 30px 6px 10px;font-size:11.5px;line-height:1.5;margin-bottom:8px}.tip br{display:none}
  .fab{padding:10px 15px;font-size:13px;bottom:calc(64px + env(safe-area-inset-bottom))}
  .fab.home{display:none!important}
  main{padding-bottom:84px}
  .nav{padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom))}.nav button{flex-direction:row;gap:5px;padding:7px 0}
}

/* ===== 配色：石墨金（Boss 11/22 定案）；保留原本暖木的變數做為底稿 ===== */
html[data-theme=graphite]{--bg:#e8eaed;--app:#f5f6f8;--app2:#fafbfc;--card:#fff;--ink:#1d2127;--ink2:#47505b;--muted:#7a828d;--line:#e0e3e8;--line2:#c5cbd3;--soft:#eceef2;
  --acc:#8f7246;--acc2:#f1ebe1;--gold:#af9263;--ok:#3f7a5a;--ok2:#e2efe7;--warn:#b0742f;--warn2:#f6eadb;--bad:#b23b3b;--bad2:#f6e0e0;--info:#3c5d85;--info2:#e2e9f2;--hfont:"Noto Sans TC",system-ui,sans-serif;--nav:#fff}
/* 深色頁首：企業感＋科技感，品牌金色點綴 */
html[data-theme=graphite]{--head:#1f2329;--headInk:#f4f5f7;--headMuted:#9aa2ad}
html[data-theme=graphite] .top{background:var(--head);color:var(--headInk);border-bottom:2px solid var(--gold)}
html[data-theme=graphite] .top h1{color:var(--headInk);letter-spacing:.03em}
html[data-theme=graphite] .sub{color:var(--headMuted)}
html[data-theme=graphite] .sub b{color:var(--headInk)}
html[data-theme=graphite] .brand{color:var(--gold)}
html[data-theme=graphite] .brand a{color:var(--headMuted)}
html[data-theme=graphite] .back{background:transparent;border:1px solid var(--gold);color:var(--gold)}
html[data-theme=graphite] .pv button{background:transparent;border-color:rgba(255,255,255,.22);color:var(--headMuted)}
html[data-theme=graphite] .pv button.on{background:var(--gold);border-color:var(--gold);color:var(--head)}
html[data-theme=graphite] .top .chip .chip{background:rgba(255,255,255,.12);color:var(--headInk)}
html[data-theme=graphite] .top .hint .hint,html[data-theme=graphite] .top small small{color:var(--headMuted)}
html[data-theme] .nav button.on{color:var(--ink);font-weight:600}
html[data-theme] .nav button.on .ic{color:var(--gold)}
html[data-theme] .card,html[data-theme] .todo,html[data-theme] .lrow{box-shadow:0 1px 2px rgba(20,25,35,.04)}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <main id="main"><div class="boot"><div class="logo">浩 森</div>載入中…</div></main>
  <nav class="nav" id="nav" style="display:none"></nav>
</div>
<button class="fab" id="fab" style="display:none"></button>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="upd" id="upd">有新版本，點一下更新</div>
<div class="ptr" id="ptr">放開以重新整理</div>
<div class="neterr" id="neterr"></div>
<div class="loading" id="loading"><div class="spin"></div><span id="loadmsg">處理中…</span></div>

<script>
const S = { home: null, real: null, as: '', cur: null, nav: 0, data: null, tab: 'sum', filter: 'all', open: {}, thumbs: {}, insFilter: 'open', showDone: false };

const TOKEN_KEY = 'housendemo_token';
const READ_ACTIONS = ['home', 'case', 'thumbs', 'pdfView'];   // 只讀；預覽模式只允許這些
const REV_ACTIONS = ['updateLog', 'saveMeeting', 'saveClientIns', 'savePlanItem', 'saveMilestone', 'saveRepair', 'actClientIns'];
const SLOW_ACTIONS = ['buildLogPdf', 'pdfLog', 'clientPdf', 'reportPdf'];   // 產生 PDF：可能要 1～3 分鐘
/** 找畫面打開時那筆資料的版本，存檔時一起送出，後端用來判斷是否已被別人改過 */
function recOf(id) {
  if (!id || !S.data) return null;
  for (const k of ['logs', 'plan', 'meetings', 'cins', 'ms', 'repairs']) { const x = (S.data[k] || []).find(y => y.id === id); if (x) return x; }
  return null;
}
const revOf = id => { const x = recOf(id); return x && x.rev || ''; };
const API = async (action, payload) => {
  if (S.as && !READ_ACTIONS.includes(action)) throw '預覽模式只能看，不能存檔';
  const p = Object.assign({ as: S.as }, payload || {});
  // 編輯表單：附上「打開時看到的原值」，伺服器逐欄比對，沒改的欄位保留同事的新內容
  if (REV_ACTIONS.includes(action) && p.id) { const x = (S.fvSnap && S.fvSnap[p.id]) || recOf(p.id); if (x) { if (!p.rev) p.rev = x.rev; if (!p.orig && x.fv && action !== 'actClientIns') p.orig = x.fv; } }
  // 加速：正在看案件時，存檔請伺服器順便帶回這個案件的最新資料（省掉第二趟讀取）
  if (S.cur && !S.as && !READ_ACTIONS.includes(action) && !SLOW_ACTIONS.includes(action) && !['stats', 'admin'].includes(action)) p._back = S.cur;
  const unwrap = d => { if (d && typeof d === 'object' && '__case' in d) { if (d.__case) S.fresh = { id: d.__id, data: d.__case, at: Date.now() }; return d.__r; } return d; };
  if (window.MOCK) return unwrap(await MOCK(action, p));
  if (navigator.onLine === false) throw '目前沒有網路連線，請確認網路後再試';
  const slow = SLOW_ACTIONS.includes(action), ctl = new AbortController(), wait = slow ? 330000 : 45000;   // 產檔等到伺服器上限（6 分鐘內）
  const timer = setTimeout(() => ctl.abort(), wait);
  let r;
  try {
    r = await fetch(CONFIG.API_URL, { method: 'POST', signal: ctl.signal, body: JSON.stringify({ action, payload: p, token: localStorage.getItem(TOKEN_KEY) }) });
  } catch (e) {
    if (e && e.name === 'AbortError') throw slow ? '等太久沒有回應，但檔案可能仍在產生。請 1～2 分鐘後到「文件」頁看看，先不要重按，以免重複產生。' : '伺服器超過 ' + wait / 1000 + ' 秒沒有回應，請稍後再試';
    throw slow ? '連線中斷了，但檔案可能仍在產生。請 1～2 分鐘後到「文件」頁看看，先不要重按。' : '連不上伺服器，請檢查網路後再試';
  } finally { clearTimeout(timer); }
  let j;
  try { j = await r.json(); } catch (e) { throw '伺服器回應異常（' + r.status + '），請稍後再試'; }
  if (!j.ok) { if (j.auth) { localStorage.removeItem(TOKEN_KEY); showLogin(j.error); } throw j.error; }
  return unwrap(j.data);
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pname = id => ((S.home.people.find(p => p.id === id) || {}).name) || id || '';
const short = n => n && n.length >= 3 ? n.slice(-2) : n;
const tcolor = n => ((S.home.trades.find(t => t.name === n) || {}).color) || '#8a7f75';
const md = d => { if (!d) return ''; const p = String(d).split(/[\/\- ]/); return p.length >= 3 ? (+p[1]) + '/' + (+p[2]) : d; };
const dnum = d => { const p = String(d || '').split(/[\/\- ]/); return p.length >= 3 ? new Date(+p[0], +p[1] - 1, +p[2]).getTime() : 0; };
const days = (a, b) => Math.round((dnum(a) - dnum(b)) / 86400000);
const ME = () => S.home.me;
const leader = () => !!ME().leader;
const preview = () => !!ME().preview;
/** 唯讀：預覽模式，或打開的案件已結案 */
const ro = () => preview() || !!(S.cur && S.data && S.data.closed);
const canCase = () => leader() || ME().role === '行政';

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function busy(on, msg) { $('#loading').style.display = on ? 'flex' : 'none'; $('#loadmsg').textContent = msg || '處理中…'; }
/** 打開表單時記下每筆資料當下的原值；之後背景更新了畫面資料，送出時仍用「你打開時看到的」比對 */
function snapFv() { const m = {}; if (S.data) ['logs', 'plan', 'meetings', 'cins', 'ms', 'repairs'].forEach(k => (S.data[k] || []).forEach(x => { if (x.fv) m[x.id] = { fv: x.fv, rev: x.rev }; })); return m; }
function sheet(html) { if ($('#sheet').style.display !== 'block') S.fvSnap = snapFv(); $('#sheet').innerHTML = '<button class="x" onclick="closeSheet()">✕</button><div class="grab"></div>' + html; $('#sheet').style.display = 'block'; $('#mask').style.display = 'block'; $('#sheet').scrollTop = 0; }
function closeSheet() { $('#sheet').style.display = 'none'; $('#mask').style.display = 'none'; }
$('#mask').onclick = closeSheet;
function guard() { if (preview()) { toast('預覽模式只能看，不能存檔'); return true; } if (ro()) { toast('案件已結案，資料唯讀'); return true; } return false; }

const STAGE_CLS = { '洽談': 'c-mute', '提案': 'c-info', '設計': 'c-info', '開案前': 'c-warn', '施工': 'c-ok', '結案': 'c-mute' };
const STAGES = ['洽談', '提案', '設計', '開案前', '施工', '結案'];
const INS_CLS = { '待處理': 'c-info', '已回報': 'c-warn', '已結案': 'c-ok' };
const LOG_CLS = { '草稿': 'c-mute', '待設計師確認': 'c-warn', '待簽核': 'c-warn', '已簽核': 'c-ok' };
const PUBLIC_HINT = '此內容會出現在給客戶的工程日誌 PDF。請用專業、客觀、明確的文字，不要承諾追加減費用或工期；人事、底價、利潤、財務等內部資訊不要寫在這裡。';
const chip = (t, cls) => `<span class="chip ${cls || 'c-mute'}">${esc(t)}</span>`;
const COLORS = ['#9A9086', '#8A6A4B', '#5B6F8C', '#4F8A8B', '#B9773A', '#6E8FA6', '#A0794F', '#6D6359', '#4F7A5C', '#A88BA0', '#C9A227', '#B0483C'];

/** 依目標那一筆調整篩選與展開，確保一定看得到 */
function prepFocus(f) {
  const d = S.data; if (!d) return;
  if (f.kind === 'ins') { const x = d.ins.find(i => i.id === f.id); S.insFilter = x && x.status === '已結案' ? 'done' : 'open'; }
  if (f.kind === 'cins') { const x = d.cins.find(i => i.id === f.id); S.copen = S.copen || {}; S.copen[f.id] = true; if (x && x.meetingId) S.copen[x.meetingId] = true; }
  if (f.kind === 'ms') S.ptab = 'ms';
  if (f.kind === 'plan') { S.ptab = 'plan'; S.popen = S.popen || {}; S.popen[f.id] = true; }
}
function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
/* ===== 本機快取：打開時先顯示手機上次記住的內容，背景再換成最新的 ===== */
const CACHE_KEY = 'housendemo_cache_v1';
function cacheGet() { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return c && c.tok === tokTail() ? c : null; } catch (e) { return null; } }
function tokTail() { try { return String(localStorage.getItem(TOKEN_KEY) || (window.MOCK ? 'mock' : '')).slice(-24); } catch (e) { return ''; } }
function cachePut(fn) {
  if (S.as) return;   // 預覽別人的畫面不存
  try { const c = cacheGet() || { tok: tokTail(), cases: {} }; fn(c); const ids = Object.keys(c.cases).sort((a, b) => c.cases[b].at - c.cases[a].at); ids.slice(6).forEach(k => delete c.cases[k]); localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (x) { } }
}
function cacheHome() { if (S.home && !S.as) cachePut(c => { c.home = S.home; c.at = Date.now(); }); }
/** 記住某個案件的資料；id 以資料本身為準（不用「目前畫面」），避免晚回來的資料存錯案件 */
function cacheCase(id, d) {
  if (S.as || !id || !d || !d.info || d.info['案件ID'] !== id) return;
  cachePut(c => { c.cases[id] = { data: d, at: Date.now() }; });
}
function syncing(on) { document.body.classList.toggle('syncing', !!on); }
async function boot() {
  if (!window.MOCK && !localStorage.getItem(TOKEN_KEY)) return showLogin();
  const cached = cacheGet();
  if (cached && cached.home && !S.home) { S.home = cached.home; if (!S.real) S.real = S.home.me; renderHome(); syncing(true); }   // 先顯示上次的工作總表
  try { S.home = await API('home'); if (!S.real) S.real = S.home.me; S.lastLoad = Date.now(); cacheHome(); notifyNew(); syncing(false); if (S.cur) { if ($('#sheet').style.display !== 'block') render(); } else if ($('#sheet').style.display !== 'block') renderHome(); }
  catch (e) { if (localStorage.getItem(TOKEN_KEY) || window.MOCK) { $('#main').innerHTML = `<div class="err">無法載入：${esc(e)}<div class="btns"><button class="btn ghost sm" id="bootretry">重試</button></div></div>`; $('#bootretry').onclick = () => { $('#main').innerHTML = '<div class="boot"><div class="logo">浩 森</div>載入中…</div>'; boot(); }; } }
}
async function reloadHome() { S.home = await API('home'); cacheHome(); }

function dueTxt(due, done) {
  if (!due) return '';
  if (done) return '期限 ' + esc(md(due));
  const d = days(due, S.home.today);
  if (d < 0) return `<span class="bad">逾期 ${-d} 天（${esc(md(due))}）</span>`;
  if (d === 0) return '<span class="bad">今天到期</span>';
  return '期限 ' + esc(md(due)) + (d <= 2 ? `（剩 ${d} 天）` : '');
}

function renderHome() {
  S.nav++; S.cur = null; S.data = null; S.ptab = null; closeSheet();
  const h = S.home, me = h.me;
  $('#nav').style.display = 'none';
  const open = h.items.filter(i => i.kind === 'ins' ? true : !i.done);
  const late = open.filter(i => i.kind === 'log' ? i.overdue : (i.due && days(i.due, h.today) < 0 && !(i.kind === 'ins' && i.status === '已回報' && i.mine)));
  const act = actSeen();
  const doneToday = h.items.filter(i => i.kind === 'todo' && i.done && String(i.doneAt).slice(0, 10) === h.today);
  $('#top').innerHTML = `<div class="brand"><span>浩森設計工作管理系統</span><span>${me.seePerf && !preview() ? '<a id="stats">統計</a>　' : ''}${leader() && !preview() ? '<a id="admin">⚙ 設定</a>　' : ''}<a id="logout">登出</a></span></div>
    <h1 class="big">${esc(short(me.name))}工作總表</h1>
    <div class="sub"><span>${esc(md(h.today))}</span><b>還有 ${open.length} 件事沒做完</b>${late.length ? `<b class="bad">・${late.length} 件逾期</b>` : ''}</div>
    ${h.testMode && S.real && S.real.role === 'Boss' ? `<div class="pvwrap" id="pvwrap"><div class="pv" id="pvrow"><button data-as="" class="${!S.as ? 'on' : ''}">我的畫面</button>${h.people.filter(p => p.id !== S.real.id).map(p => `<button data-as="${p.id}" class="${S.as === p.id ? 'on' : ''}">看 ${esc(short(p.name))}</button>`).join('')}</div><div class="pvhint">左右滑動看其他人 ›</div></div>` : ''}
    ${preview() ? `<div class="pvbar">預覽中：這是 ${esc(me.name)} 看到的畫面（只能看，不能存檔）</div>` : ''}`;
  $$('[data-as]').forEach(b => b.onclick = async () => { const old = S.as; S.as = b.dataset.as; busy(true, '切換中…'); try { await reloadHome(); renderHome(); } catch (e) { S.as = old; toast(e); } busy(false); });
  pvOverflow();
  if ($('#admin')) $('#admin').onclick = () => vAdmin();
  if ($('#stats')) $('#stats').onclick = () => vStats();
  $('#logout').onclick = logout;

  const sorted = open.slice().sort((a, b) => (dnum(a.due) || 9e15) - (dnum(b.due) || 9e15));
  let html = installTip() + `<h2>我的待辦<small>${open.length} 件未完成</small>${preview() ? '' : '<span class="act" id="addTodo">＋ 新增</span>'}</h2><div class="tl">`;
  html += sorted.length ? sorted.map(itemHTML).join('') : '<div class="empty">都做完了 👍</div>';
  if (doneToday.length) {
    html += `<div class="more" id="tgDone">${S.showDone ? '收起' : '今天完成 ' + doneToday.length + ' 件'}</div>`;
    if (S.showDone) html += doneToday.map(itemHTML).join('');
  }
  html += `</div>`;

  if (leader() && !preview()) html += overviewHTML(h);
  const live = h.cases.filter(c => c.status !== '已結案' && c.status !== '未成交');
  const list = live.filter(c => S.filter === 'all' || c.designer === me.id);
  html += `<h2>進行中案件<small>點選進入</small>${canCase() && !preview() ? '<span class="act" id="addCase">＋ 新增案件</span>' : ''}</h2>
    <div class="seg"><button data-f="all" class="${S.filter === 'all' ? 'on' : ''}">全部</button><button data-f="mine" class="${S.filter === 'mine' ? 'on' : ''}">我負責的</button></div>`;
  html += list.length ? STAGES.map(st => {
    const g = list.filter(c => c.stage === st); if (!g.length) return '';
    return `<div class="month">${st}・${g.length}</div>` + g.map(c => `<div class="card tap" data-case="${c.id}">
      <div class="row2"><div><div class="t">${esc(c.name)}${c.act && act[c.id] !== undefined && c.act > act[c.id] ? '<span class="cdot" title="有新動態"></span>' : ''}</div><div class="s">${esc([c.client, c.address].filter(String).join('・') || '—')}</div></div>${chip(c.stage, STAGE_CLS[c.stage])}</div>
      <div class="mini"><span>設計師 ${esc(pname(c.designer) || '未指定')}</span><span>最新日誌 ${c.lastLog ? esc(md(c.lastLog)) : '—'}</span><span>未結指示 ${c.openIns}</span></div></div>`).join('');
  }).join('') : '<div class="empty">沒有案件</div>';
  $('#main').innerHTML = html;
  $$('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; renderHome(); });
  $$('[data-case]').forEach(e => e.onclick = () => openCase(e.dataset.case, 'sum'));
  $$('[data-ovcase]').forEach(e => e.onclick = () => { const [c, l] = e.dataset.ovcase.split('|'); openCase(c, 'log', l || undefined); });

async function openCase(id, tab, logId, focus) {
  const nav = ++S.nav;   // 每次切換案件給一個序號；晚回來的舊請求序號不同，就只存起來、不碰畫面
  const show = () => {
    if (nav !== S.nav) return;
    S.cur = id; S.tab = tab || S.tab || 'sum'; S.open = logId ? { [logId]: true } : (S.open || {});
    if (focus) prepFocus(focus);
    const c = S.home && S.home.cases.find(x => x.id === id); if (c) markAct(id, c.act);
    render();
    if (logId) setTimeout(() => { const r = document.querySelector(`[data-lid="${logId}"]`); if (r) { r.scrollIntoView({ block: 'start', behavior: 'smooth' }); flash(r); } }, 60);
    if (focus) setTimeout(() => { const r = document.querySelector(`[data-fid="${focus.id}"]`); if (r) { r.scrollIntoView({ block: 'center', behavior: 'smooth' }); flash(r); } }, 60);
  };
  const cached = !S.as && cacheGet(), hit = cached && cached.cases[id];
  S.tab = tab || 'sum'; S.open = logId ? { [logId]: true } : {};
  if (hit) {   // 先顯示手機上次記住的內容（不轉圈），背景再更新
    S.data = hit.data; show(); syncing(true);
    try { const fresh = await API('case', { id }); cacheCase(id, fresh); if (nav === S.nav && S.cur === id) { S.data = fresh; if ($('#sheet').style.display !== 'block') render(); } }
    catch (e) { if (nav === S.nav) netErr(e); } finally { if (nav === S.nav) syncing(false); }
    return;
  }
  busy(true, '載入案件…');
  try { const d = await API('case', { id }); cacheCase(id, d); if (nav === S.nav) { S.data = d; show(); } }
  catch (e) { if (nav === S.nav) toast(e); } finally { if (nav === S.nav) busy(false); }
}
async function refreshCase() {
  const id = S.cur;
  if (S.fresh && S.fresh.id === id && Date.now() - S.fresh.at < 5000) { S.data = S.fresh.data; S.fresh = null; cacheCase(id, S.data); return; }   // 存檔時已一起帶回，不用再讀
  S.fresh = null;
  const d = await API('case', { id });
  cacheCase(id, d);                      // 手機記住的內容一律以「資料本身是哪個案件」為準
  if (S.cur === id) S.data = d;          // 等待中已切到別的案件：不能把舊案件的資料放進目前畫面
}

/* ===== 進度計畫（第 4 項先行部分；查驗與放行規則待定） ===== */
const ymdShort = v => v ? String(v).slice(5).replace('/', '/') : '';
const range = (a, b) => a || b ? `${ymdShort(a) || '?'}–${ymdShort(b) || '?'}` : '未排日期';
/** 日誌參考：這個工種最早一篇日誌的日期（只當參考，不自動認定） */
function logHint(item) {
  if (!item.trade) return '';
  const ds = S.data.logs.filter(l => l.trades.includes(item.trade)).map(l => l.date).sort();
  if (!ds.length) return '';
  const near = item.start ? ds.filter(x => x >= addDays(item.start, -14)) : ds;

  busy(true, '統計中…');
  let r;

/** 修改前後差異（字元層級） */
function diffText(a, b) {
  a = String(a || ''); b = String(b || '');
  if (a === b) return '';
  const n = a.length, m = b.length;
  if (n * m > 400000) return `<del>${esc(a)}</del><ins>${esc(b)}</ins>`;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);

  const push = (md, ch) => { if (md !== mode) { out += mode ? `<${mode}>${esc(buf)}</${mode}>` : esc(buf); mode = md; buf = ''; } buf += ch; };
  while (i < n && j < m) { if (a[i] === b[j]) { push('', a[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) push('del', a[i++]); else push('ins', b[j++]); }
  while (i < n) push('del', a[i++]); while (j < m) push('ins', b[j++]);
  out += mode ? `<${mode}>${esc(buf)}</${mode}>` : esc(buf);
  return out;
}

const CASE_TYPES = ['住宅', '商業空間', '旅宿', '其他'];
const CASE_SOURCES = ['轉介', '自行開發', '官網／LINE', '舊客回購'];
const opts = (list, cur) => ['', ...list, ...(cur && !list.includes(cur) ? [cur] : [])].map(o => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('');
const toInput = v => String(v || '').slice(0, 10).replace(/\//g, '-');

/** 修改案件資料（主管、行政、負責設計師；金額限可看金額者） */
function caseForm() {
  if (preview()) return guard();
  const c = S.data.info, money = ME().seeMoney, moneyEdit = !!S.data.canMoney;
  const ds = S.home.people.filter(p => p.role === '設計師' || p.role === 'Boss' || p.role === '主管');
  const inp = (k, id, type, ph) => `<label>${k}</label><input id="${id}" ${type ? `type="${type}"` : ''} value="${esc(type === 'date' ? toInput(c[k]) : (c[k] || ''))}" ${ph ? `placeholder="${ph}"` : ''}>`;
  sheet(`<h3>編輯案件資料</h3><div class="s">${esc(c['案件名稱'])}・只會存有改動的欄位，並記錄修改人</div>
    <div class="fsec">基本資料</div>
    ${inp('案件名稱', 'f_name')}${inp('客戶姓名', 'f_client')}${inp('客戶電話', 'f_phone', 'tel')}${inp('客戶LINE', 'f_line')}${inp('地址', 'f_addr')}
    <label>類型</label><select id="f_type">${opts(CASE_TYPES, c['類型'])}</select>
    <label>來源</label><select id="f_src">${opts(CASE_SOURCES, c['來源'])}</select>
    <label>負責設計師</label><select id="f_des"><option value=""></option>${ds.map(p => `<option value="${p.id}" ${p.id === c['負責設計師'] ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <div class="fsec">重要日期</div>
    <div class="dgrid">${CASE_DATES.map((k, i) => `<div><label>${k}</label><input id="f_d${i}" type="date" value="${esc(toInput(c[k]))}"></div>`).join('')}</div>
    <div class="fsec">其他</div>
    ${money ? `<div class="dgrid"><div><label>設計費</label><input id="f_fee" inputmode="numeric" value="${esc(c['設計費'] || '')}" ${moneyEdit ? '' : 'disabled'}></div><div><label>工程金額</label><input id="f_amt" inputmode="numeric" value="${esc(c['工程金額'] || '')}" ${moneyEdit ? '' : 'disabled'}></div></div>${moneyEdit ? '' : '<div class="hint">金額你可以看，修改暫定只有 Boss 和行政可以。</div>'}` : ''}
    <label>雲端資料夾網址</label><input id="f_drive" value="${esc(c['Drive資料夾'] || '')}" placeholder="貼上 Google 雲端硬碟資料夾網址">
    <div class="hint">留空的話，第一次產生日誌 PDF 時系統會自動建立資料夾。</div>
    <label>備註</label><textarea id="f_note">${esc(c['備註'] || '')}</textarea>
    <div class="btns"><button class="btn pri" id="f_go">儲存</button></div>`);
  $('#f_go').onclick = async () => {
    const fields = {
      '案件名稱': $('#f_name').value.trim(), '客戶姓名': $('#f_client').value.trim(), '客戶電話': $('#f_phone').value.trim(),
      '客戶LINE': $('#f_line').value.trim(), '地址': $('#f_addr').value.trim(), '類型': $('#f_type').value, '來源': $('#f_src').value,
      '負責設計師': $('#f_des').value, 'Drive資料夾': $('#f_drive').value.trim(), '備註': $('#f_note').value.trim()
    };
    CASE_DATES.forEach((k, i) => fields[k] = $('#f_d' + i).value);
    if (moneyEdit) { fields['設計費'] = $('#f_fee').value.trim(); fields['工程金額'] = $('#f_amt').value.trim(); }
    if (!fields['案件名稱']) return toast('案件名稱不能空白');
    if (fields['預計開工日'] && fields['預計完工日'] && fields['預計完工日'] < fields['預計開工日']) return toast('預計完工日不能早於預計開工日');
    // 只送出真的改過的欄位，並附上打開時看到的原值；別人同時改了別的欄位不會被蓋掉
    const shown = k => CASE_DATES.includes(k) ? toInput(c[k]) : String(c[k] == null ? '' : c[k]);
    const changed = {}, orig = {};
    Object.keys(fields).forEach(k => { if (String(fields[k]) !== shown(k)) { changed[k] = fields[k]; orig[k] = c[k] == null ? '' : c[k]; } });
    if (!Object.keys(changed).length) { closeSheet(); return toast('沒有變更'); }
    busy(true, '儲存中…');
    try {
      const r = await API('saveCaseInfo', { id: S.cur, fields: changed, orig });
      await refreshCase(); closeSheet(); render(); reloadHome().catch(() => { });
      toast(r.changed.length ? '已更新：' + r.changed.join('、') : '沒有變更');
    } catch (e) { toast(e); } finally { busy(false); }
  };
}

function newCase() {
  if (guard()) return;
  const ds = S.home.people.filter(p => p.role === '設計師' || p.role === 'Boss' || p.role === '主管');
  sheet(`<h3>新增案件</h3>
    <label>案件名稱</label><input id="cn" placeholder="例如：七期 陳公館">
    <label>客戶姓名</label><input id="cc">
    <label>客戶電話</label><input id="cp" type="tel">
    <label>地址</label><input id="ca">
    <label>類型</label><select id="ct"><option></option><option>住宅</option><option>商業空間</option><option>旅宿</option><option>其他</option></select>
    <label>來源</label><select id="cs"><option></option><option>轉介</option><option>自行開發</option><option>官網／LINE</option><option>舊客回購</option></select>
    <label>負責設計師</label><select id="cd"><option value=""></option>${ds.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <div class="btns"><button class="btn pri" id="cgo">建立案件</button></div>`);
  $('#cgo').onclick = async () => {
    const name = $('#cn').value.trim(); if (!name) return toast('請填寫案件名稱');
    busy(true); try {
      const id = await API('saveCase', { name, client: $('#cc').value.trim(), phone: $('#cp').value.trim(), address: $('#ca').value.trim(), type: $('#ct').value, source: $('#cs').value, designer: $('#cd').value });
      await reloadHome(); closeSheet(); busy(false); openCase(id, 'sum'); toast('案件已建立');
    } catch (e) { busy(false); toast(e); }
  };
}

function tradeAdmin() {
  let color = COLORS[0];
  sheet(`<h3>工種設定</h3><div class="s">這裡的工種會出現在每個人寫日誌的選項裡。</div>
    <div class="tpick" style="margin-top:12px">${S.home.trades.map(t => `<span class="tchip" style="background:${t.color};font-size:13px;padding:5px 10px">${esc(t.name)}</span>`).join('')}</div>
    <label>新增工種</label><input id="tn" placeholder="例如：石材、壁紙、監控">
    <label>顏色</label><div class="sw" id="tsw">${COLORS.map((c, k) => `<i data-c="${c}" class="${k === 0 ? 'on' : ''}" style="background:${c}"></i>`).join('')}</div>
    <div class="btns"><button class="btn pri" id="tgo2">新增</button></div>`);
  $$('#tsw i').forEach(i => i.onclick = () => { $$('#tsw i').forEach(x => x.classList.remove('on')); i.classList.add('on'); color = i.dataset.c; });
  $('#tgo2').onclick = async () => {
    const name = $('#tn').value.trim(); if (!name) return toast('請填寫工種名稱');
    busy(true); try { await API('saveTrade', { name, color }); await reloadHome(); closeSheet(); if (S.admin) vAdmin('trade'); else tradeAdmin(); toast('已新增「' + name + '」'); } catch (e) { toast(e); } finally { busy(false); }
  };
}

/* PWA 擴充：登入、更新、自動刷新、新事項提醒 */
function showLogin(msg) {
  $('#nav').style.display = 'none'; $('#fab').style.display = 'none'; $('#top').style.display = 'none'; closeSheet();
  $('#main').style.padding = '0';
  $('#main').innerHTML = `<div class="login"><img class="logo" src="icons/logo.png" alt="浩森設計 HOUSEN"><h1>浩森設計工作管理系統</h1><div class="rule"></div>
    <div class="gbtn" id="gbtn"></div><p class="hint">請使用公司 Google 帳號（@housenaid.com）登入</p><div class="lerr" id="lerr">${esc(msg || '')}</div>
    <div class="foot"><b>HOUSEN</b><i>INTERIOR DESIGN</i></div></div>`;
  let tries = 0;
  const init = () => {
    if (!(window.google && google.accounts && google.accounts.id)) {
      if (++tries === 25) $('#lerr').textContent = '正在連線 Google 登入服務…';
      if (tries >= 60) return gisFail();   // 約 12 秒
      return setTimeout(init, 200);
    }
    $('#lerr').textContent = msg || '';
    google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, hd: 'housenaid.com', callback: onGoogle, auto_select: true, ux_mode: 'popup' });
    google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'zh-TW', width: 260 });
  };
  init();
}
function gisFail() {
  $('#lerr').innerHTML = (navigator.onLine === false ? '目前沒有網路連線。' : 'Google 登入服務載入失敗：可能是網路不穩，或瀏覽器的廣告／追蹤阻擋功能擋住了 Google。')
    + '<div class="btns" style="justify-content:center"><button class="btn ghost sm" id="gretry" style="flex:0 0 auto">重新載入登入</button></div>';
  $('#gretry').onclick = () => {
    $$('script[src*="accounts.google.com/gsi"]').forEach(x => x.remove());
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client?t=' + Date.now(); sc.async = true; document.head.appendChild(sc);
    showLogin();
  };
}
async function onGoogle(resp) {
  $('#lerr').textContent = '登入中…';
  try {
    const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', idToken: resp.credential }) });
    const j = await r.json();
    if (!j.ok) { $('#lerr').textContent = j.error; return; }
    localStorage.setItem(TOKEN_KEY, j.data.token);
    $('#top').style.display = ''; $('#main').style.padding = '';
    $('#main').innerHTML = '<div class="boot"><div class="logo">浩 森</div>載入中…</div>';
    boot();
  } catch (e) { $('#lerr').textContent = '網路連線失敗，請再試一次'; }
}
function logout() {
  try { localStorage.removeItem(CACHE_KEY); } catch (e) { }
  localStorage.removeItem(TOKEN_KEY);
  try { google.accounts.id.disableAutoSelect(); } catch (e) { }
  S.home = null; S.real = null; S.as = ''; showLogin();
}

const ACT_KEY = 'housendemo_act';
function actSeen() {
  let m; try { m = JSON.parse(localStorage.getItem(ACT_KEY) || 'null'); } catch (e) { m = null; }
  if (!m && S.home) { m = {}; S.home.cases.forEach(c => m[c.id] = c.act || ''); localStorage.setItem(ACT_KEY, JSON.stringify(m)); }
  m = m || {}; if (S.home) S.home.cases.forEach(c => { if (m[c.id] === undefined) m[c.id] = ''; });
  return m;
}
function markAct(id, act) { const m = actSeen(); m[id] = act || ''; localStorage.setItem(ACT_KEY, JSON.stringify(m)); }
const SEEN_KEY = 'housendemo_seen';
function seenSet() { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); } }
function itemKey(i) { return i.kind + ':' + i.id + ':' + (i.status || ''); }
function isNew(i) { return S.newKeys && S.newKeys.has(itemKey(i)); }
function notifyNew() {
  if (!S.home || preview()) return;
  const seen = seenSet(), first = !localStorage.getItem(SEEN_KEY);
  const open = S.home.items.filter(i => i.kind === 'ins' || !i.done);
  const fresh = open.filter(i => !seen.has(itemKey(i)) && i.from !== ME().id);
  S.newKeys = new Set(first ? [] : fresh.map(itemKey));
  if (!first && fresh.length) {
    const nIns = fresh.filter(i => i.kind === 'ins').length, nLog = fresh.filter(i => i.kind === 'log').length, nTodo = fresh.length - nIns - nLog;
    toast('你有 ' + [nLog ? nLog + ' 篇日誌要處理' : '', nIns ? nIns + ' 則新指示／回報' : '', nTodo ? nTodo + ' 件新待辦' : ''].filter(String).join('、'));
    if (navigator.setAppBadge) navigator.setAppBadge(open.length).catch(() => { });
  }
  localStorage.setItem(SEEN_KEY, JSON.stringify(open.map(itemKey)));
}

/** 重新抓資料。成功回傳 true；失敗保留目前畫面、顯示原因與重試（填寫中的表單不會被動到） */
async function silentRefresh(manual) {
  if (!S.home) return false;
  if ($('#sheet').style.display === 'block') return false;   // 正在填表單，不重畫畫面
  try {
    const nav = S.nav, id = S.cur;
    const home = await API('home'), data = id ? await API('case', { id }) : null;
    if ($('#sheet').style.display === 'block') return true;
    if (data) cacheCase(id, data);
    if (nav !== S.nav) return true;   // 等待中切換了畫面：只存起來，不改目前畫面
    S.home = home; if (data && S.cur === id) S.data = data; S.lastLoad = Date.now(); cacheHome(); notifyNew();
    if (S.cur) render(); else renderHome();
    netErr(''); return true;
  } catch (e) { netErr(e, manual); return false; }
}
function netErr(e, manual) {
  const bar = $('#neterr');
  if (!e) { bar.style.display = 'none'; return; }
  bar.innerHTML = `<span>更新失敗：${esc(e)}<br><small>畫面上是上次成功載入的資料</small></span><button id="netretry">重試</button><b id="netx">✕</b>`;
  bar.style.display = 'flex';
  $('#netx').onclick = () => bar.style.display = 'none';
  $('#netretry').onclick = async () => { busy(true, '重新整理中…'); const ok = await silentRefresh(true); busy(false); toast(ok ? '已更新' : '仍然無法更新'); };
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.lastLoad && Date.now() - S.lastLoad > 30000) silentRefresh();
});
setInterval(() => { if (document.visibilityState === 'visible' && S.lastLoad && Date.now() - S.lastLoad > 180000) silentRefresh(); }, 60000);

(function pullToRefresh() {
  let y0 = null, dy = 0; const ptr = $('#ptr');
  addEventListener('touchstart', e => { y0 = (scrollY <= 0 && $('#sheet').style.display !== 'block') ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0) ptr.style.transform = `translate(-50%, ${Math.min(dy, 90) - 60}px)`; ptr.textContent = dy > 80 ? '放開以重新整理' : '下拉重新整理'; }, { passive: true });
  addEventListener('touchend', async () => {
    if (y0 !== null && dy > 80) { ptr.textContent = '更新中…'; ptr.style.transform = 'translate(-50%, 20px)'; const ok = await silentRefresh(true); toast(ok ? '已更新' : '更新失敗，請看上方說明'); }
    ptr.style.transform = 'translate(-50%, -60px)'; y0 = null;
  });
})();

function standalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone; }
function installTip() {
  if (standalone() || localStorage.getItem('housendemo_tip')) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const how = ios ? '在 Safari 點下方「分享」<b>⬆︎</b>，選「<b>加入主畫面</b>」' : '在瀏覽器選單選「<b>安裝應用程式</b>」或「<b>加到主畫面</b>」';
  setTimeout(() => { const x = $('#tipx'); if (x) x.onclick = () => { localStorage.setItem('housendemo_tip', 1); x.parentElement.remove(); }; }, 0);
  return `<div class="tip"><span class="tx" id="tipx">✕</span>把「浩森工作」加到手機主畫面，之後像 App 一樣直接開：<br>${how}</div>`;
}

/* 新版偵測：除了 service worker 更新，也比對網站上的 index.html 是否和目前開著的不同（不必手動改版本號） */
let BUILD_SIG = null;
const sig = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return h; };
async function checkBuild() {
  if (window.MOCK || document.visibilityState !== 'visible') return;
  try {
    const t = await (await fetch('index.html?v=' + Date.now(), { cache: 'no-store' })).text();
    if (BUILD_SIG === null) BUILD_SIG = sig(t);
    else if (sig(t) !== BUILD_SIG) showUpdate(null);
  } catch (e) { }
}
function showUpdate(w) {
  const u = $('#upd'); u.style.display = 'block';
  u.onclick = () => { if (w) w.postMessage('skip'); else location.reload(); };
}
checkBuild();
setInterval(checkBuild, 10 * 60000);
document.addEventListener('visibilitychange', checkBuild);
if ('serviceWorker' in navigator && !window.MOCK) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (!reg) return;
    const show = w => showUpdate(w);
    if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) show(w); });
    });
    setInterval(() => reg.update(), 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
  }).catch(() => { });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
}

boot();
</script>
